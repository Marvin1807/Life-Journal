<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Was, wenn das Internet schon lange tot ist?</title>
    <style>
      @font-face { font-family: "Cap"; font-style: normal; font-weight: 900; src: url("lib/fonts/rubik-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cap"; font-style: normal; font-weight: 800; src: url("lib/fonts/rubik-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mono"; font-style: normal; font-weight: 400; src: url("lib/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mono"; font-style: normal; font-weight: 800; src: url("lib/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #scene { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      /* lädt die Schriften vor dem ersten Frame */
      .fontwarm { position: absolute; left: -9999px; font: 900 20px Cap; }
      .fontwarm i { font: 800 20px Cap; } .fontwarm b { font: 400 20px Mono; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="internet-tot" data-start="0" data-duration="83" data-width="1080" data-height="1920">
      <canvas id="scene" class="clip" data-start="0" data-duration="83" data-track-index="0"></canvas>
      <audio id="sound" src="audio/sound.wav" data-start="0" data-duration="83" data-track-index="2" data-volume="1"></audio>
    </div>
    <div class="fontwarm">ÄÖÜ <i>ÄÖÜ</i> <b>Forum</b></div>

    <script src="lib/gsap.min.js"></script>
    <script>
      // Leere Root-Timeline: gibt HyperFrames die Länge vor; die Szene selbst hört auf hf-seek.
      window.__timelines = window.__timelines || {};
      window.__timelines["internet-tot"] = gsap.timeline({ paused: true }).set({}, {}, 83);
    </script>
    <script type="module" src="scene.js"></script>
  </body>
</html>
